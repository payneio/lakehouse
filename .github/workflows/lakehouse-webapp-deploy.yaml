name: lakehouse Webapp - Build and Deploy SWA

on:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - 'staticwebapp.config.json'
      - '.github/workflows/lakehouse-webapp-deploy.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-webapp-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write   # so the SWA action can comment on PR previews

jobs:
  build-and-deploy:
    name: Build webapp (pnpm) and upload to SWA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: webapp
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: webapp
        env:
          # Vite inlines VITE_* env vars at build time. Set as a GitHub
          # repository variable (Settings → Variables) so it's editable
          # without changing the workflow file. Falls back to the
          # default Web App hostname if the variable isn't set.
          VITE_API_URL: ${{ vars.BACKEND_API_URL || 'https://lakehouse-api.azurewebsites.net' }}
        run: pnpm run build

      - name: Stage SWA config alongside built assets
        # The SWA runtime expects staticwebapp.config.json to live next
        # to index.html in the deployed bundle. Copying here keeps the
        # source-of-truth at the repo root without restructuring the
        # Vite project.
        run: cp webapp/staticwebapp.config.json webapp/dist/staticwebapp.config.json

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # Point at the prebuilt directory; tell the action not to
          # run Oryx (which doesn't have pnpm).
          app_location: webapp/dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true
