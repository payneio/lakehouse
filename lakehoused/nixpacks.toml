# Nixpacks build configuration for Coolify deployment.
#
# Key issue: uv is available during the build/install phase (auto-detected
# from uv.lock) but is NOT carried into the runtime image by default.
# The app needs uv at runtime because amplifier_foundation's ModuleActivator
# calls `uv pip install` to lazy-activate orchestrator/tool modules.
#
# The [phases.setup] nixPkgs persist into the runtime image, so listing uv
# here ensures it's available when the app starts.
#
# NOTE: Coolify base directory is set to "lakehoused/" so Nixpacks runs
# with lakehoused/ as the working directory. The webapp source is at
# ../webapp/ (repo root level).

[phases.setup]
nixPkgs = ["python312", "nodejs_22", "uv"]
aptPkgs = ["git"]

[phases.install]
cmds = [
    # Python: create venv and install lakehoused + dependencies
    "uv venv /opt/venv",
    "VIRTUAL_ENV=/opt/venv uv pip install '.'",
    # Frontend: install pnpm and webapp dependencies
    "npm install -g pnpm",
    "cd ../webapp && pnpm install --frozen-lockfile",
]

[phases.build]
cmds = [
    # Build the frontend SPA
    "cd ../webapp && pnpm run build",
    # Copy built assets into lakehoused package for serving
    "cp -r ../webapp/dist lakehoused/webapp_dist",
]

[start]
cmd = "/opt/venv/bin/uvicorn lakehoused.main:app --host 0.0.0.0 --port 8000"
