# Nixpacks build configuration for Coolify deployment.
#
# Key issue: uv is available during the build/install phase (auto-detected
# from uv.lock) but is NOT carried into the runtime image by default.
# The app needs uv at runtime because amplifier_foundation's ModuleActivator
# calls `uv pip install` to lazy-activate orchestrator/tool modules.
#
# The "..." syntax means "keep the provider's auto-detected packages, and
# add ours on top." Without it, our list would replace the defaults entirely.

[phases.setup]
nixPkgs = ["...", "uv"]
aptPkgs = ["...", "git"]

[phases.install]
cmds = [
    "...",
    # Frontend: install pnpm and webapp dependencies
    "npm install -g pnpm",
    "cd ../webapp && pnpm install --frozen-lockfile",
]

[phases.build]
cmds = [
    "...",
    # Build the frontend SPA and copy into lakehoused package
    "cd ../webapp && pnpm run build",
    "cp -r ../webapp/dist lakehoused/webapp_dist",
]

[start]
cmd = "uvicorn lakehoused.main:app --host 0.0.0.0 --port 8000"
