# Nixpacks build configuration for Coolify deployment.
#
# Coolify base_directory is "/" (repo root), so all paths are relative
# to the repo root. The Python app is in lakehoused/, webapp in webapp/.
#
# Key issue: uv is available during the build/install phase (auto-detected
# from uv.lock) but is NOT carried into the runtime image by default.
# The app needs uv at runtime because amplifier_foundation's ModuleActivator
# calls `uv pip install` to lazy-activate orchestrator/tool modules.
#
# The "..." syntax means "keep the provider's auto-detected values and
# append ours" rather than replacing them entirely.

[phases.setup]
nixPkgs = ["...", "uv", "nodejs_22"]

[phases.install]
cmds = [
    "...",
    # Frontend: install pnpm and webapp deps in one RUN layer
    # (each cmd becomes a separate Dockerfile RUN, so npm -g install
    # isn't visible in the next RUN's PATH)
    "npm install -g pnpm && cd webapp && pnpm install --frozen-lockfile",
]

[phases.build]
cmds = [
    "...",
    # Build the frontend SPA and copy into lakehoused package
    "cd webapp && npx pnpm run build",
    "cp -r webapp/dist lakehoused/lakehoused/webapp_dist",
]

[start]
cmd = "cd lakehoused && uvicorn lakehoused.main:app --host 0.0.0.0 --port 8000"
