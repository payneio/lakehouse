# Nixpacks build config for combined Python backend + React frontend

providers = ["python"]

[phases.setup]
nixPkgs = ["...", "nodejs_22"]

[phases.install]
cmds = [
    "...",
    "cd webapp && npx pnpm install --frozen-lockfile",
    "/opt/venv/bin/pip install 'amplifier-core @ git+https://github.com/microsoft/amplifier-core@main' 'amplifier-foundation @ git+https://github.com/microsoft/amplifier-foundation@main'",
    "cd lakehoused && /opt/venv/bin/pip install .",
]

[phases.build]
cmds = [
    "cd webapp && npx vite build",
    "cp -r webapp/dist lakehoused/lakehoused/webapp_dist",
]

[start]
cmd = "/opt/venv/bin/uvicorn lakehoused.main:app --host 0.0.0.0 --port 8000"
